<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true">
        <rect width="1024" height="1024" rx="218" fill="#0B0C0E" />
        <circle cx="512" cy="512" r="344" fill="none" stroke="#D6A166" stroke-width="18" />
        <circle cx="512" cy="512" r="317" fill="none" stroke="#D6A166" stroke-width="5" opacity="0.92" />
        <g stroke="#D6A166" stroke-linecap="round">
          <g stroke-width="8">
            <line x1="512" y1="205" x2="512" y2="225" transform="rotate(45 512 512)" />
            <line x1="512" y1="205" x2="512" y2="225" transform="rotate(90 512 512)" />
            <line x1="512" y1="205" x2="512" y2="225" transform="rotate(135 512 512)" />
            <line x1="512" y1="205" x2="512" y2="225" transform="rotate(180 512 512)" />
            <line x1="512" y1="205" x2="512" y2="225" transform="rotate(225 512 512)" />
            <line x1="512" y1="205" x2="512" y2="225" transform="rotate(270 512 512)" />
            <line x1="512" y1="205" x2="512" y2="225" transform="rotate(315 512 512)" />
          </g>
          <g stroke-width="5" opacity="0.95">
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(15 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(30 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(60 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(75 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(105 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(120 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(150 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(165 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(195 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(210 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(240 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(255 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(285 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(300 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(330 512 512)" />
            <line x1="512" y1="205" x2="512" y2="218" transform="rotate(345 512 512)" />
          </g>
        </g>
        <path d="M500 194 L524 194 L512 216 Z" fill="#D6A166" />
        <circle cx="512" cy="512" r="236" fill="#0B0C0E" stroke="#D6A166" stroke-width="12" />
        <circle cx="512" cy="512" r="207" fill="none" stroke="#D6A166" stroke-width="3" opacity="0.52" />
        <g stroke="#D6A166" stroke-width="28" stroke-linecap="round" fill="none">
          <line x1="512" y1="512" x2="512" y2="354" />
          <line x1="512" y1="512" x2="375" y2="591" />
          <line x1="512" y1="512" x2="649" y2="591" />
        </g>
        <g fill="#0B0C0E" stroke="#D6A166" stroke-width="12">
          <circle cx="512" cy="348" r="25" />
          <circle cx="370" cy="594" r="25" />
          <circle cx="654" cy="594" r="25" />
        </g>
        <circle cx="512" cy="512" r="61" fill="#D6A166" />
        <circle cx="512" cy="512" r="28" fill="#0B0C0E" />
        <circle cx="512" cy="512" r="10" fill="#D6A166" />
      </svg>
      <div class="brand">
        <b>Kryptos</b>
        <span id="site">—</span>
      </div>
      <button class="ib" id="open-app" data-i18n-title="openApp"></button>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="site" class="on"><span class="ms"></span><span data-i18n="tabSite"></span></button>
      <button data-tab="search"><span class="ms"></span><span data-i18n="tabSearch"></span></button>
      <button data-tab="gen"><span class="ms"></span><span data-i18n="tabGenerate"></span></button>
    </nav>

    <main id="content" aria-live="polite"></main>

    <div class="actions" id="actions" hidden>
      <button class="act" id="save-btn"><span class="ms"></span><span data-i18n="saveShort"></span></button>
      <button class="act" id="qr-btn"><span class="ms"></span><span data-i18n="qrButton"></span></button>
    </div>

    <label class="inline-toggle">
      <input type="checkbox" id="inline-on" />
      <span data-i18n="inlineToggle"></span>
    </label>

    <footer>
      <span class="ms">wifi_off</span>
      <span data-i18n="footerText"></span>
    </footer>
    <script src="brand-icons.js"></script>
    <!-- jsQR (Apache-2.0, github.com/cozmo/jsQR): reads 2FA QR codes from the page screenshot. -->
    <script src="jsQR.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

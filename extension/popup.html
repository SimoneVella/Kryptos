<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true">
        <rect width="1024" height="1024" rx="230" fill="#0B0C0E" />
        <circle cx="512" cy="512" r="370" fill="none" stroke="#D6A166" stroke-width="64" />
        <g stroke="#D6A166" stroke-width="72" stroke-linecap="round">
          <line x1="512" y1="512" x2="512" y2="300" /><line x1="512" y1="512" x2="328" y2="618" /><line x1="512" y1="512" x2="696" y2="618" />
        </g>
        <circle cx="512" cy="512" r="96" fill="#D6A166" /><circle cx="512" cy="512" r="38" fill="#0B0C0E" />
      </svg>
      <div class="brand">
        <b>Kryptos</b>
        <span id="site">—</span>
      </div>
      <button class="ib" id="open-app" data-i18n-title="openApp"></button>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="site" class="on"><span class="ms"></span><span data-i18n="tabSite"></span></button>
      <button data-tab="search"><span class="ms"></span><span data-i18n="tabSearch"></span></button>
      <button data-tab="gen"><span class="ms"></span><span data-i18n="tabGenerate"></span></button>
    </nav>

    <main id="content" aria-live="polite"></main>

    <div class="actions" id="actions" hidden>
      <button class="act" id="save-btn"><span class="ms"></span><span data-i18n="saveShort"></span></button>
      <button class="act" id="qr-btn"><span class="ms"></span><span data-i18n="qrButton"></span></button>
    </div>

    <label class="inline-toggle">
      <input type="checkbox" id="inline-on" />
      <span data-i18n="inlineToggle"></span>
    </label>

    <footer>
      <span class="ms">wifi_off</span>
      <span data-i18n="footerText"></span>
    </footer>
    <script src="brand-icons.js"></script>
    <!-- jsQR (Apache-2.0, github.com/cozmo/jsQR): reads 2FA QR codes from the page screenshot. -->
    <script src="jsQR.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

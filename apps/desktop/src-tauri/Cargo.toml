[package]
name = "kryptos-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kryptos_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kryptos-core = { path = "../../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
dirs = "5"
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
uuid = "1"
url = "2"
tauri-plugin-fs = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# Touch ID / Mac password to confirm browser fills (confirm.rs). Same objc2 family Tauri already uses.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"

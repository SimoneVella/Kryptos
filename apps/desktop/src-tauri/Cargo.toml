[package]
name = "kryptos-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kryptos_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kryptos-core = { path = "../../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
dirs = "5"
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
uuid = "1"
url = "2"
tauri-plugin-fs = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"
libc = "0.2"
# Touch ID / Mac password to confirm browser fills (confirm.rs) and Touch ID vault unlock (biometric.rs).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSData"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"

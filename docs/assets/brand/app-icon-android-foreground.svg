      <line x1="512" y1="205" x2="512" y2="218" transform="rotate(150 512 512)"/>
      <line x1="512" y1="205" x2="512" y2="218" transform="rotate(165 512 512)"/>
      <line x1="512" y1="205" x2="512" y2="218" transform="rotate(195 512 512)"/>
      <line x1="512" y1="205" x2="512" y2="218" transform="rotate(210 512 512)"/>
      <line x1="512" y1="205" x2="512" y2="218" transform="rotate(240 512 512)"/>
      <line x1="512" y1="205" x2="512" y2="218" transform="rotate(255 512 512)"/>
      <line x1="512" y1="205" x2="512" y2="218" transform="rotate(285 512 512)"/>
